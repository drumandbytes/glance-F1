name: Auto merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  auto-merge:
    # The org default token is read-only.
    permissions:
      contents: write
      pull-requests: write
    # Not gated on workflow_run.event: Dependabot branches run CI as 'push'.
    # The reusable workflow's author check is the real gate.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.actor.login == 'dependabot[bot]' ||
       github.event.workflow_run.actor.login == 'dnb-robot[bot]')
    uses: drumandbytes/reusable-actions/.github/workflows/auto-merge.yml@v1
    with:
      # dnb-robot opens release-please PRs (patch-only) and track-map PRs, which
      # never touch the manifest and so always count as patch.
      patch-only-authors: '["dnb-robot[bot]"]'
      # A GITHUB_TOKEN merge triggers no workflows: no release, no publish.yml run.
      use-app-token-for-merge: true
    secrets:
      DNB_ROBOT_CLIENT_ID: ${{ secrets.DNB_ROBOT_CLIENT_ID }}
      AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

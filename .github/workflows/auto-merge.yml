name: Auto merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  auto-merge:
    # The reusable workflow cannot grant itself more than the caller has, and
    # the org default for GITHUB_TOKEN is read-only — so declare it here.
    permissions:
      contents: write
      pull-requests: write
    # Only the conclusion is checked, not workflow_run.event: a same-repo
    # branch (which is how Dependabot and dnb-robot push) triggers CI as
    # 'push', not 'pull_request', so gating on the event would silently skip
    # every run. The reusable workflow looks up the PR itself and enforces
    # the author allow-list, which is the actual safety gate; a run with no
    # open PR just no-ops.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.actor.login == 'dependabot[bot]' ||
       github.event.workflow_run.actor.login == 'dnb-robot[bot]')
    uses: drumandbytes/reusable-actions/.github/workflows/auto-merge.yml@v1
    with:
      # dependabot[bot]'s dependency bumps: unconditional.
      allowed-authors: '["dependabot[bot]"]'
      # dnb-robot[bot] opens two different kinds of PR here now: release-please's
      # own version-bump PR (patch/minor/major all possible - gate to patch
      # only, same as eraser/music-router), and regenerate-track-maps' PR
      # (never touches .release-please-manifest.json, so its version never
      # changes base-to-head - trivially "a patch bump" every time, i.e.
      # unconditional in practice, without needing its own allow-list entry).
      patch-only-authors: '["dnb-robot[bot]"]'
      # release-please's merge needs to cascade into another release-please
      # run (to actually cut the tag) and publish.yml's tag-triggered build -
      # neither happens from a GITHUB_TOKEN-authored merge.
      use-app-token-for-merge: true
    secrets: inherit

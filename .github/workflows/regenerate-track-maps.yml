name: Regenerate track maps

# Monthly is a safety margin, not a real cadence requirement - track layouts
# only ever change between seasons. peter-evans/create-pull-request only
# opens/updates a PR when the script actually changed a file (plain `git
# status` under the hood), so a no-op month produces nothing to review.
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r API/requirements.txt

      - name: Generate track maps
        working-directory: API
        env:
          TRACK_COLOUR: "#e5d486"
        run: python scripts/generate_track_maps.py

      # Repo default GITHUB_TOKEN is read-only (org policy), and a PR opened
      # with it needs a maintainer to manually approve the CI run before it
      # can even start. dnb-robot is a recognized collaborator with write
      # access, so a PR opened as it skips both problems - and unlike
      # GITHUB_TOKEN-authored pushes, this one properly triggers CI/auto-merge.
      - uses: actions/create-github-app-token@v3
        id: app_token
        with:
          client-id: ${{ secrets.DNB_ROBOT_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: drumandbytes
          repositories: glance-F1

      - name: Open PR with any changes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app_token.outputs.token }}
          commit-message: "chore: regenerate track maps"
          title: "chore: regenerate track maps"
          body: |
            Monthly scheduled run of `API/scripts/generate_track_maps.py`.

            Only circuits whose rendered SVG actually changed are included -
            review the diff before merging to confirm it's a real layout
            change and not a data-source hiccup. Merging this alone doesn't
            publish a new image; that's still the existing manual
            build+push step.
          branch: chore/regenerate-track-maps
          add-paths: API/static/track_maps/**

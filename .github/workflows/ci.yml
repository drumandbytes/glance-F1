name: CI

on:
  # push and pull_request both fired on every commit to an open PR (the same
  # jobs twice) and push again on merge to master. One trigger covers PR
  # branches, the same as the org's other repos.
  push:
    branches-ignore: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # build, vet, gofmt and test, as the hand-written job did.
  test:
    uses: drumandbytes/reusable-actions/.github/workflows/go-ci.yml@v1
    with:
      # Explicit rather than read from go.mod: its `go 1.26.0` directive
      # would install exactly 1.26.0, while "1.26" gets the latest 1.26.x.
      go-version: "1.26"
      # Never run here before; enable once its findings are triaged.
      run-golangci-lint: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false

  # Audit of this repo's own workflows; accepted findings are in
  # .github/zizmor.yml.
  zizmor:
    uses: drumandbytes/reusable-actions/.github/workflows/zizmor.yml@v1

  # Single stable name for the org's required-status-check ruleset
  # (protecting-main) to point at, regardless of how the real jobs above are
  # split or renamed.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: [test, build, zizmor]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: API
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Run tests
        working-directory: API
        run: pytest

  # Single stable name for the org's required-status-check ruleset
  # (protecting-main) to point at, regardless of how the real jobs above are
  # split or renamed - see drumandbytes/reusable-actions' own ci.yml, which
  # this mirrors (no off-the-shelf reusable workflow in that repo fits a
  # plain Python service, so this is defined directly here instead).
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

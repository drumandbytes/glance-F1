name: Build and publish image

# Builds our patched fork while the upstream PR is pending, so the fix can be
# deployed without waiting on skyallinott/f1_api:latest to be rebuilt.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: API
          push: true
          tags: |
            ghcr.io/drumandbytes/f1_api:${{ steps.version.outputs.tag }}
            ghcr.io/drumandbytes/f1_api:latest

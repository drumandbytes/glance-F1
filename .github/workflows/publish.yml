name: Publish image

# Triggered by a version tag push - normally release-please.yml pushing one
# automatically once its release PR is merged, or push one by hand:
# git tag v1.1.0 && git push origin v1.1.0. Either way, a deliberate release
# action, not every commit to master. Uses GITHUB_TOKEN for GHCR auth
# (packages: write below) - no separate secret to manage.
on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/drumandbytes/paddock-api
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: API
          file: API/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

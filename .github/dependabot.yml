version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/API"
    schedule:
      interval: "weekly"
    groups:
      pip:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
